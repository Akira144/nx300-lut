# /mnt/mmc/lut/lutd.conf  --  NX300 LUT daemon
#
# Paths are on the camera (the SD card is mounted at /mnt/mmc).
# Lines starting with # are ignored.

# Where to look for new JPEGs. The whole card is fine: only *.JPG is processed.
WATCH=/mnt/mmc

# The .cube file to apply. Put your look here.
LUT=/mnt/mmc/lut/look.cube

# Log file (append).
LOG=/mnt/mmc/lutd.log

# replace = rewrite the original file in place (what you want for SOOC)
# suffix  = keep the original and write SAM_1234_LUT.JPG next to it
MODE=replace
SUFFIX=_LUT

# Keep the un-graded original in a hidden folder. Set to 0 once you trust it.
KEEP_ORIG=1
ORIG_DIR=/mnt/mmc/.lut/orig

# Copy EXIF/ICC from the source (keeps date, orientation, lens data).
KEEP_META=1

# 拍 RAW 时也出图：从 .SRW 里抽出内嵌的全尺寸 JPEG，套 LUT 存成同名 .JPG。
# 注意：那张预览约 2.1 MB / 20 MP，画质低于相机正常拍的 JPEG（Fine 约 6-8 MB）。
# 拍 RAW+JPEG 时不会重复处理（有同名 .JPG 就跳过 SRW）。
SRW=1

# JPEG quality of the re-encoded file. 95 is visually lossless-ish; 92 is smaller.
QUALITY=95

# Ignore files smaller than this (thumbnails, half-written files).
MIN_BYTES=100000
