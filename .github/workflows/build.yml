name: build-lutd

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: |
          if [ -f ci.sh ]; then bash ci.sh; else bash nx300-lut/ci.sh; fi

      - uses: actions/upload-artifact@v4
        with:
          name: lutd-arm
          path: |
            lutd.arm
            lutd-hf.arm
            lutd-musl.arm
            nx300-lut/lutd.arm
            nx300-lut/lutd-hf.arm
            nx300-lut/lutd-musl.arm
          if-no-files-found: error
